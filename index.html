/* ---- ceiling: the scrubs photo on a big flat panel overhead, facing down ---- */
{
  const tex = new THREE.TextureLoader().load(UP_IMG);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const panel = new THREE.Mesh(
    new THREE.PlaneGeometry(1760, 880),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, fog: false })
  );
  panel.position.set(0, 420, 0);
  panel.rotation.x = Math.PI / 2;        // lying flat, picture face down
  panel.renderOrder = -3;
  scene.add(panel);
}

/* ---- the night sky, everywhere else ---- */
{
  const c = document.createElement("canvas"); c.width = 4; c.height = 512;
  const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, "#0a1030"); gr.addColorStop(.35, "#101c48"); gr.addColorStop(.6, "#2b2550");
  gr.addColorStop(.8, "#5c3450"); gr.addColorStop(1, "#160f1e");
  g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16),
    new THREE.MeshBasicMaterial({ map: t, side: THREE.BackSide, fog: false, depthWrite: false }));
  sky.renderOrder = -1;
  scene.add(sky);
}

/* ---- stars, spelling one line that rings the whole sky ---- */
{
  const MESSAGE = "YOU MAKE ME PROUD EACH AND EVERY DAY";

  // rasterise the single line once, so we can sample exactly where the letters are.
  // The line must fit the ring once, so first find the size that spans ~86% of the width.
  const CW = 4096, CH = 320;
  const cv = document.createElement("canvas"); cv.width = CW; cv.height = CH;
  const cg = cv.getContext("2d");
  cg.textBaseline = "middle";
  let size = 300;
  cg.font = `700 ${size}px Helvetica, Arial, sans-serif`;
  while (cg.measureText(MESSAGE).width > CW * 0.86 && size > 20) {
    size -= 3; cg.font = `700 ${size}px Helvetica, Arial, sans-serif`;
  }
  const wText = cg.measureText(MESSAGE).width;
  cg.fillStyle = "#000"; cg.fillRect(0, 0, CW, CH);
  cg.fillStyle = "#fff";
  // centred, and mirrored at the edges so the line joins itself with no seam
  const x0 = (CW - wText) / 2;
  cg.fillText(MESSAGE, x0, CH / 2);
  const data = cg.getImageData(0, 0, CW, CH).data;

  // the line sits on a wide cylindrical band: letters ring the sky, upright and level
  const R = 1500, BAND_H = CH / CW * (2 * Math.PI * R);   // keeps letter shape true
  const pts = [];
  const yCenter = R * 0.14;                          // low in the sky
  for (let py = 0; py < CH; py += 4) {
    for (let px = 0; px < CW; px += 4) {
      if (data[(py * CW + px) * 4] < 128) continue;
      const u = px / CW;                             // position around the ring
      const v = (py / CH - .5) * BAND_H;             // height on the band
      const th = u * Math.PI * 2;
      pts.push(Math.sin(th) * R, yCenter - v, -Math.cos(th) * R);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts), 3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xffffff, size: 8, sizeAttenuation: true, transparent: true, opacity: .95,
    map: canvasTex(64, 64, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.35, "rgba(220,230,255,.8)");
      gr.addColorStop(1, "rgba(180,200,255,0)");
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    }),
    depthWrite: false, fog: false
  })));

  // scenery stars: a band of them hugging the words, brightest near the line,
  // thinning out above and below, so the message sits in a field of stars
  const bandY = yCenter;                       // the line's own height
  const bandH = 520;                           // how far the halo reaches, up and down
  const n2 = 2600, sp = new Float32Array(n2 * 3);
  for (let i2 = 0; i2 < n2; i2++) {
    // bias the height toward the line: most stars close to it, a few further out
    const t = (Math.random() + Math.random() + Math.random()) / 3 * 2 - 1;   // -1..1, peaked at 0
    const yy = bandY + t * bandH;
    // size varies: a handful of bright ones, many faint
    sp.set([0, 0, 0], i2 * 3);                 // placeholder, filled below
    const th = Math.random() * TAU;
    const rr = R * (1.02 + Math.random() * 0.05);
    sp.set([Math.sin(th) * rr, yy, -Math.cos(th) * rr], i2 * 3);
  }
  const g2 = new THREE.BufferGeometry();
  g2.setAttribute("position", new THREE.BufferAttribute(sp, 3));
  scene.add(new THREE.Points(g2, new THREE.PointsMaterial({
    color: 0xffffff, size: 7, sizeAttenuation: true, transparent: true, opacity: .75,
    map: canvasTex(64, 64, (g, w) => {
      const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.4, "rgba(225,235,255,.7)");
      gr.addColorStop(1, "rgba(180,200,255,0)");
      g.fillStyle = gr; g.fillRect(0, 0, w, w);
    }),
    depthWrite: false, fog: false
  })));

function petalGeo(width, len, cup, curl, twist = 0) {
  const geo = new THREE.PlaneGeometry(width, len, 10, 24);
  geo.translate(0, len / 2, 0);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i); const t = y / len, u = x / (width / 2);
    let z = -cup * u * u * width * (1 - t * .4) + curl * t * t * len + Math.sin(t * 9 + u * 3) * .006;
    const a = twist * t, c = Math.cos(a), s = Math.sin(a);
    p.setXYZ(i, x * c - z * s, y, x * s + z * c);
  }
  geo.computeVertexNormals(); return geo;
}

  // warm halo around the middle, as in the photograph
  const halo = g.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, w * .48);
  halo.addColorStop(0, "rgba(255,200,90,.30)"); halo.addColorStop(1, "rgba(255,200,90,0)");
  g.fillStyle = halo; g.fillRect(0, 0, w, h);

  const CUT = "#fff9cc";
  const draw = (fn) => { g.fillStyle = CUT; fn(); };

  /* ---- SUN: solid disc, ring gap, then pointed rays ---- */
  const cx = w / 2, cy = h / 2 + 6, R = 118;
  draw(() => { g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill(); });
  // the ring gap is punched out of the disc, then a smaller disc is restored
  g.globalCompositeOperation = "destination-out";
  g.beginPath(); g.arc(cx, cy, R * .95, 0, TAU); g.fill();
  g.beginPath(); g.arc(cx, cy, R * .66, 0, TAU); g.fill();
  g.globalCompositeOperation = "source-over";
  draw(() => { g.beginPath(); g.arc(cx, cy, R * .62, 0, TAU); g.fill(); });

  // rays: eight long pointed flames, staggered with eight shorter ones
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * TAU - Math.PI / 2 + .196;
    const long = i % 2 === 0;
    const tip = R + (long ? 128 : 74);
    const halfa = long ? .105 : .13;
    const inR = R * .92;
    // a flame shape: wide at the base, curling to a point, with a hooked tip
    g.beginPath();
    g.moveTo(cx + Math.cos(a - halfa) * inR, cy + Math.sin(a - halfa) * inR);
    g.quadraticCurveTo(cx + Math.cos(a - halfa * 1.4) * (inR + (tip - inR) * .72),
                       cy + Math.sin(a - halfa * 1.4) * (inR + (tip - inR) * .72),
                       cx + Math.cos(a) * tip, cy + Math.sin(a) * tip);
    g.quadraticCurveTo(cx + Math.cos(a + halfa * 1.4) * (inR + (tip - inR) * .72),
                       cy + Math.sin(a + halfa * 1.4) * (inR + (tip - inR) * .72),
                       cx + Math.cos(a + halfa) * inR, cy + Math.sin(a + halfa) * inR);
    g.closePath(); g.fillStyle = CUT; g.fill();
    // hooked barb on the long rays
    if (long) {
      const bx = cx + Math.cos(a + .34) * (inR + (tip - inR) * .55);
      const by = cy + Math.sin(a + .34) * (inR + (tip - inR) * .55);
      g.beginPath(); g.moveTo(bx, by);
      g.quadraticCurveTo(bx + Math.cos(a + 1.3) * 34, by + Math.sin(a + 1.3) * 34,
                         bx + Math.cos(a + 2.5) * 20, by + Math.sin(a + 2.5) * 20);
      g.quadraticCurveTo(bx + Math.cos(a + 1.5) * 12, by + Math.sin(a + 1.5) * 12, bx, by);
      g.closePath(); g.fill();
    }
  }

  /* ---- BORDER: a repeating scroll of curls with teardrops, top and bottom ---- */
  const scroll = (yTop, dir) => {
    const n = 6, span = w / n, y = yTop;
    // the continuous wavy ribbon
    g.beginPath();
    for (let i = 0; i < n; i++) {
      const x = i * span;
      g.moveTo(x, y);
      g.bezierCurveTo(x + span * .10, y - 44 * dir, x + span * .30, y - 62 * dir, x + span * .42, y - 18 * dir);
      g.bezierCurveTo(x + span * .50, y + 8 * dir, x + span * .40, y + 34 * dir, x + span * .30, y + 22 * dir);
      g.bezierCurveTo(x + span * .22, y + 12 * dir, x + span * .34, y - 6 * dir, x + span * .52, y - 6 * dir);
      g.bezierCurveTo(x + span * .72, y - 6 * dir, x + span * .86, y - 26 * dir, x + span, y - 14 * dir);
    }
    g.lineWidth = 15; g.strokeStyle = CUT; g.stroke();
    // curlicues between repeats
    for (let i = 0; i < n; i++) {
      const x = i * span + span * .72, yy = y - 26 * dir;
      g.beginPath(); g.arc(x, yy, 15, 0, Math.PI * 1.55); g.lineWidth = 13; g.stroke();
    }
    // little teardrops / tassels hanging from the wave
    for (let i = 0; i < n; i++) {
      const x = i * span + span * .16, yy = y + 30 * dir;
      g.beginPath();
      g.moveTo(x, yy - 22 * dir);
      g.bezierCurveTo(x + 15, yy - 6 * dir, x + 11, yy + 16 * dir, x, yy + 22 * dir);
      g.bezierCurveTo(x - 11, yy + 16 * dir, x - 15, yy - 6 * dir, x, yy - 22 * dir);
      g.fillStyle = CUT; g.fill();
    }
  };
  scroll(112, 1);
  scroll(h - 112, -1);
});


// open cylinder so the cut-out design wraps right around the lantern
const lanternGeo = new THREE.CylinderGeometry(.62, .50, 1.28, 40, 1, true);
const lanterns = [];
for (let i = 0; i < 42; i++) {
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(lanternGeo, new THREE.MeshBasicMaterial({ map: lanternTex, side: THREE.DoubleSide, transparent: true, opacity: 1 })));
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  glow.scale.setScalar(4.5); grp.add(glow);
  const r = rnd(12, 48), a = rnd(0, TAU);
  grp.position.set(Math.cos(a) * r, rnd(-6, 26), Math.sin(a) * r);
  grp.userData = { vy: rnd(.012, .03), ph: rnd(0, TAU), glow, mat: grp.children[0].material, a, r };
  grp.scale.setScalar(rnd(.85, 1.45));
  scene.add(grp); lanterns.push(grp);
}
const lanternLights = [0, 1, 2].map(() => { const l = new THREE.PointLight(0xff9a40, 26, 26); scene.add(l); return l; });

/* ================= animate ================= */
const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  lanterns.forEach((L, i) => {
    const u = L.userData;
    L.position.y += u.vy; u.a += .0006;
    L.position.x = Math.cos(u.a) * u.r + Math.sin(t * .3 + u.ph) * .6;
    L.position.z = Math.sin(u.a) * u.r;
    L.rotation.z = Math.sin(t * .8 + u.ph) * .05;
    if (L.position.y > 30) { L.position.y = -8; u.r = rnd(12, 48); }
    const fl = .85 + .1 * Math.sin(t * 9 + u.ph) + .05 * Math.sin(t * 23 + u.ph);
    u.glow.material.opacity = fl; u.mat.color.setScalar(fl + .1);
    if (i < 3) { lanternLights[i].position.copy(L.position); lanternLights[i].intensity = 26 * fl; }
  });
  bouquet.rotation.z = Math.sin(t * .6) * .02;
  warm.intensity = 28 + Math.sin(t * 5) * 3;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
